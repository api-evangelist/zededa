      - name: summary
        in: query
        required: false
        type: boolean
      - name: deviceName
        in: query
        required: false
        type: string
      - name: projectName
        in: query
        required: false
        type: string
      - name: namePattern
        in: query
        required: false
        type: string
      - name: labelName
        in: query
        required: false
        type: string
      - name: appInstName
        in: query
        required: false
        type: string
      - name: deviceNamePattern
        in: query
        required: false
        type: string
      - name: projectNamePattern
        in: query
        required: false
        type: string
      - name: next.pageToken
        description: Page Token
        in: query
        required: false
        type: string
      - name: next.orderBy
        description: OrderBy helps in sorting the list response
        in: query
        required: false
        type: array
