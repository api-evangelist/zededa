openapi: 3.2.0
info:
  title: ZEDEDA Kubernetes Service Kubernetes Git Ops API
  description: The ZEDEDA Kubernetes Service provides APIs for managing Kubernetes deployments and Helm charts in edge clusters.
  termsOfService: https://www.zededa.com/terms
  version: '1.0'
  contact:
    name: ZEDEDA API Support
    url: https://www.zededa.com/support
    email: support@zededa.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: /api
security:
- ApiKeyAuth: []
tags:
- name: KubernetesGitOps
  description: APIs for managing GitOps configurations and continuous deployment from Git repositories to Kubernetes clusters
paths:
  /v1/cluster/instances/kubernetes/gitrepos:
    get:
      summary: List all GitRepo configurations
      description: 'Retrieve a list of all GitRepo configurations with their status and summary information. Includes statistics about sync status and resource counts.


        **Example Request:**

        ```

        GET /v1/cluster/instances/kubernetes/gitrepos

        ```


        **Example Response:**

        ```json

        {

        "totalCount": 2,

        "stateSummary": {

        "description": "GitRepo Status Summary",

        "total": 2,

        "values": {

        "Active": 1,

        "Pending": 1

        }

        },

        "gitrepos": [

        {

        "id": "gitrepo-abc123",

        "name": "app-manifests",

        "title": "Application Manifests Repository",

        "description": "Git repository containing production application manifests",

        "workspace": "default",

        "status": {

        "display": {

        "ready_bundle_deployments": "3/3",

        "state": "Active"

        }

        },

        "created_at": "2024-01-15T10:30:00Z",

        "updated_at": "2024-01-15T11:00:00Z"

        },

        {

        "id": "gitrepo-def456",

        "name": "helm-charts",

        "title": "Helm Charts Repository",

        "description": "Repository containing Helm chart definitions",

        "workspace": "default",

        "status": {

        "display": {

        "ready_bundle_deployments": "0/2",

        "state": "Pending"

        }

        },

        "created_at": "2024-01-14T15:20:00Z",

        "updated_at": "2024-01-14T15:25:00Z"

        }

        ]

        }

        ```'
      operationId: KubernetesGitOps_ListGitRepos
      responses:
        '200':
          description: Successfully retrieved GitRepo configuration list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRepoListResponse'
        '400':
          description: Bad Request. The API gateway did not process the request because of invalid value of filter parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to list GitRepo configurations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to retrieve GitRepo list due to server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - KubernetesGitOps
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        schema:
          type: string
    post:
      summary: Create a new GitRepo configuration
      description: 'Create a new GitRepo configuration to enable continuous deployment from a Git repository. This allows automatic synchronization of Kubernetes manifests or Helm charts from a Git repository to target clusters.


        **Example Request:**

        ```json

        {

        "metadata": {

        "name": "app-manifests",

        "title": "Application Manifests Repository",

        "description": "Git repository containing production application manifests"

        },

        "data": {

        "project_id": "proj-12345",

        "repo_details": {

        "url": "https://github.com/myorg/k8s-manifests.git",

        "branch": "main",

        "path_list": ["applications/", "ingress/"]

        },

        "auth": {

        "git": {

        "secret": {

        "type": "SECRET_TYPE_OPAQUE",

        "name": "git-credentials"

        }

        }

        },

        "target": {

        "type": "GIT_REPO_TARGET_TYPE_CLUSTER",

        "value": "cluster-abc123"

        }

        }

        }

        ```


        **Example Response:**

        ```json

        {

        "operationType": "OPS_TYPE_UNSPECIFIED",

        "operationStatus": "OPS_STATUS_UNSPECIFIED",

        "objectKind": "",

        "objectId": "gitrepo-abc123",

        "objectName": "app-manifests",

        "objectRevision": "",

        "objectType": "OBJECT_TYPE_UNSPECIFIED",

        "operationTime": "",

        "startTime": "",

        "endTime": "",

        "user": "",

        "httpStatusCode": 201,

        "httpStatusMsg": "",

        "jobId": "",

        "error": [

        {

        "ec": "zMsgSucess",

        "location": "",

        "details": ""

        }

        ]

        }

        ```'
      operationId: KubernetesGitOps_CreateGitRepo
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '201':
          description: Successfully created GitRepo configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '400':
          description: Bad Request. Invalid GitRepo configuration or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to create GitRepo configurations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '409':
          description: Conflict. GitRepo configuration with the same name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to create GitRepo configuration due to server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        schema:
          type: string
      tags:
      - KubernetesGitOps
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitRepoCreateRequest'
        required: true
  /v1/cluster/instances/kubernetes/gitrepos/id/{gitrepoId}:
    get:
      summary: Get GitRepo configuration by ID
      description: 'Retrieve detailed information about a specific GitRepo configuration including its current status, sync information, and metadata.


        **Example Request:**

        ```

        GET /v1/cluster/instances/kubernetes/gitrepos/id/gitrepo-abc123

        ```


        **Example Response:**

        ```json

        {

        "id": "gitrepo-abc123",

        "name": "app-manifests",

        "title": "Application Manifests Repository",

        "description": "Git repository containing production application manifests",

        "workspace": "default",

        "data": {

        "project_id": "proj-12345",

        "repo_details": {

        "url": "https://github.com/myorg/k8s-manifests.git",

        "branch": "main",

        "commit": "a1b2c3d4e5f6",

        "path_list": ["applications/", "ingress/"]

        },

        "target": {

        "type": "GIT_REPO_TARGET_TYPE_CLUSTER",

        "value": "cluster-abc123"

        }

        },

        "status": {

        "display": {

        "ready_bundle_deployments": "3/3",

        "state": "Active"

        },

        "conditions": [

        {

        "type": "Ready",

        "status": "True",

        "message": "GitRepo is ready and syncing"

        }

        ],

        "resource_counts": {

        "ready": 3,

        "desired_ready": 3

        }

        },

        "created_at": "2024-01-15T10:30:00Z",

        "updated_at": "2024-01-15T11:00:00Z",

        "created_by": "user@example.com",

        "updated_by": "user@example.com"

        }

        ```'
      operationId: KubernetesGitOps_GetGitRepo
      responses:
        '200':
          description: Successfully retrieved GitRepo configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitRepoGetResponse'
        '400':
          description: Bad Request. Invalid GitRepo ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to view this GitRepo configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '404':
          description: Not Found. GitRepo configuration with the specified ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to retrieve GitRepo configuration due to server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: gitrepoId
        description: 'Unique identifier of the GitRepo (required). Example: ''gitrepo-abc123'''
        in: path
        required: true
        schema:
          type: string
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        schema:
          type: string
      tags:
      - KubernetesGitOps
    delete:
      summary: Delete GitRepo configuration
      description: 'Delete a GitRepo configuration. This will stop the synchronization from the Git repository and remove all associated resources from the target clusters. This action is irreversible.


        **Example Request:**

        ```

        DELETE /v1/cluster/instances/kubernetes/gitrepos/id/gitrepo-abc123

        ```


        **Example Response:**

        ```json

        {

        "operationType": "OPS_TYPE_UNSPECIFIED",

        "operationStatus": "OPS_STATUS_UNSPECIFIED",

        "objectKind": "",

        "objectId": "gitrepo-abc123",

        "objectName": "app-manifests",

        "objectRevision": "",

        "objectType": "OBJECT_TYPE_UNSPECIFIED",

        "operationTime": "",

        "startTime": "",

        "endTime": "",

        "user": "",

        "httpStatusCode": 200,

        "httpStatusMsg": "",

        "jobId": "",

        "error": [

        {

        "ec": "zMsgSucess",

        "location": "",

        "details": ""

        }

        ]

        }

        ```


        **Warning:** This operation will remove the GitRepo configuration and stop synchronization. All resources deployed through this GitRepo will be removed from target clusters.


        **Note:** The gitrepo_id parameter is **required** and must be a valid GitRepo identifier.'
      operationId: KubernetesGitOps_DeleteGitRepo
      responses:
        '200':
          description: Successfully deleted GitRepo configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '400':
          description: Bad Request. Invalid GitRepo ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to delete this GitRepo configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '404':
          description: Not Found. GitRepo configuration with the specified ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '409':
          description: Conflict. Cannot delete GitRepo configuration because it is currently in use or in a transitioning state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to delete GitRepo configuration due to server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: gitrepoId
        description: 'Unique identifier of the GitRepo (required). Example: ''gitrepo-abc123'''
        in: path
        required: true
        schema:
          type: string
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        schema:
          type: string
      tags:
      - KubernetesGitOps
    put:
      summary: Update GitRepo configuration
      description: 'Update an existing GitRepo configuration. This allows modification of repository details, authentication settings, and target configuration. The GitRepo name cannot be changed after creation.


        **Example Request:**

        ```json

        {

        "gitrepo_id": "gitrepo-abc123",

        "metadata": {

        "name": "app-manifests",

        "title": "Updated Application Manifests Repository",

        "description": "Updated Git repository containing production application manifests"

        },

        "data": {

        "project_id": "proj-12345",

        "repo_details": {

        "url": "https://github.com/myorg/k8s-manifests.git",

        "branch": "production",

        "path_list": ["applications/", "ingress/", "monitoring/"]

        },

        "auth": {

        "git": {

        "secret": {

        "type": "SECRET_TYPE_OPAQUE",

        "name": "updated-git-credentials"

        }

        }

        },

        "target": {

        "type": "GIT_REPO_TARGET_TYPE_CLUSTER_GROUP",

        "value": "production-clusters"

        }

        }

        }

        ```


        **Example Response:**

        ```json

        {

        "operationType": "OPS_TYPE_UNSPECIFIED",

        "operationStatus": "OPS_STATUS_UNSPECIFIED",

        "objectKind": "",

        "objectId": "gitrepo-abc123",

        "objectName": "app-manifests",

        "objectRevision": "",

        "objectType": "OBJECT_TYPE_UNSPECIFIED",

        "operationTime": "",

        "startTime": "",

        "endTime": "",

        "user": "",

        "httpStatusCode": 200,

        "httpStatusMsg": "",

        "jobId": "",

        "error": [

        {

        "ec": "zMsgSucess",

        "location": "",

        "details": ""

        }

        ]

        }

        ```'
      operationId: KubernetesGitOps_UpdateGitRepo
      responses:
        '200':
          description: Successfully updated GitRepo configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '400':
          description: Bad Request. Invalid GitRepo configuration or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to update this GitRepo configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '404':
          description: Not Found. GitRepo configuration with the specified ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '409':
          description: Conflict. Cannot update GitRepo configuration due to conflicting state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to update GitRepo configuration due to server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: gitrepoId
        description: 'Unique identifier of the GitRepo to update (required). Example: ''gitrepo-abc123'''
        in: path
        required: true
        schema:
          type: string
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        schema:
          type: string
      tags:
      - KubernetesGitOps
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  $ref: '#/components/schemas/GitRepoMetadata'
                  description: Metadata for the GitRepo (name cannot be updated, required)
                data:
                  $ref: '#/components/schemas/GitRepoData'
                  description: Data specification for the GitRepo (required)
              description: Request message for updating an existing GitRepo configuration
              title: GitRepo update request
              required:
              - gitrepo_id
              - metadata
              - data
        required: true
components:
  schemas:
    ZsrvResponse:
      type: object
      properties:
        operationType:
          $ref: '#/components/schemas/ZcOpsType'
          title: "Describes one of the operations type : possible values\n                        Read/Delete/Create/Update/List"
        operationStatus:
          $ref: '#/components/schemas/ZcOpsStatus'
          title: if this is log running job
        objectKind:
          type: string
          title: zedcloud object kind on which the operation was performed
        objectId:
          type: string
          title: Unique value identifies the object that was operated on
        objectName:
          type: string
          title: name of the object
        objectRevision:
          type: string
          title: 'object revision post the operation, note Read operation

            doesn''t change the revision'
        objectType:
          $ref: '#/components/schemas/ObjectType'
        operationTime:
          type: string
          title: time of operation
        startTime:
          type: string
          title: total time taken by operations
        endTime:
          type: string
        user:
          type: string
          title: the operation is performed on behalf of this user
        httpStatusCode:
          type: integer
          format: int32
          title: http response
        httpStatusMsg:
          type: string
          title: summary of the error in text format
        jobId:
          type: string
          title: for tracking asynchronous tasks
        error:
          type: array
          items:
            $ref: '#/components/schemas/ZsrvError'
          title: 'one or more errors will be set if the operation failed

            i.e. httpStatusCode != 2xx'
    ZsrvErrorCode:
      type: string
      enum:
      - zMsgErrorNone
      - zMsgSucess
      - NotFound
      - AlreadyExists
      - VersionMismatch
      - RangeError
      - LargeResult
      - IncompleteData
      - InvalidData
      - FunctionUnsupported
      - NoMemory
      - SendFailure
      - Timeout
      - BadReqBody
      - BadReqParam
      - InvalidFieldFormat
      - UrlNotFound
      - ApiVersionNotSupported
      - Unauthorized
      - Forbidden
      - Conflict
      - NotModified
      - DependencyConflict
      - JsonFmtError
      - ProtoFmtError
      - CertError
      - DataBaseConnection
      - DBError
      - zMsgAccepted
      - zMsgCreated
      - PreConditionFailed
      - InternalServerError
      default: zMsgErrorNone
      description: "- zMsgErrorNone: common validation errors\n - IncompleteData: message had fields that weren't filled in\n - InvalidData: message contained the field that wasn't expected\n - FunctionUnsupported: this feature unavailable on this version of device\n - InvalidFieldFormat: message contained the field that wasn't correctly formatted\n - JsonFmtError: Marshal / Unmarshal errors\n - DataBaseConnection: generic DB error"
      title: ZedCould internal error code
    GitRepoCreateRequest:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/GitRepoMetadata'
          description: Metadata for the GitRepo (required)
        data:
          $ref: '#/components/schemas/GitRepoData'
          description: Data specification for the GitRepo (required)
      description: Request message for creating a new GitRepo configuration
      title: GitRepo create request
      required:
      - metadata
      - data
    GitRepoTargetType:
      type: string
      enum:
      - GIT_REPO_TARGET_TYPE_UNKNOWN
      - GIT_REPO_TARGET_TYPE_ALL_CLUSTER
      - GIT_REPO_TARGET_TYPE_CLUSTER
      - GIT_REPO_TARGET_TYPE_CLUSTER_GROUP
      default: GIT_REPO_TARGET_TYPE_UNKNOWN
      title: GitRepo Target Types
    GitRepoSecretConfig:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SecretType'
          description: Type of secret for authentication
        name:
          type: string
          description: Name of the secret
      description: Secret configuration for GitRepo authentication
      title: GitRepo secret configuration
    ObjectType:
      type: string
      enum:
      - OBJECT_TYPE_UNSPECIFIED
      - OBJECT_TYPE_USER
      - OBJECT_TYPE_EDGE_NODE
      - OBJECT_TYPE_EDGE_APP
      - OBJECT_TYPE_IMAGE
      - OBJECT_TYPE_EDGE_APP_INSTANCE
      - OBJECT_TYPE_PROJECT
      - OBJECT_TYPE_NETWORK
      - OBJECT_TYPE_DATASTORE
      - OBJECT_TYPE_SERVICE
      - OBJECT_TYPE_SERVICE_INSTANCE
      - OBJECT_TYPE_ENTERPRISE
      - OBJECT_TYPE_ROLE
      - OBJECT_TYPE_CREDENTIAL
      - OBJECT_TYPE_NETWORK_INSTANCE
      - OBJECT_TYPE_VOLUME_INSTANCE
      - OBJECT_TYPE_REALM
      - OBJECT_TYPE_AUTHPROFILE
      - OBJECT_TYPE_POLICY
      - OBJECT_TYPE_APP_POLICY
      - OBJECT_TYPE_CLUSTER_INSTANCE
      - OBJECT_TYPE_PLUGIN
      - OBJECT_TYPE_DOC_POLICY
      - OBJECT_TYPE_ORCHESTRATOR_CLUSTER
      - OBJECT_TYPE_TAGS
      - OBJECT_TYPE_EDGE_NODE_INTERFACE
      - OBJECT_TYPE_DEPLOYMENT
      - OBJECT_TYPE_ENTITLEMENTS
      - OBJECT_TYPE_DATA_STREAM
      - OBJECT_TYPE_API_USAGE
      - OBJECT_TYPE_APP_INSTANCE_SNAPSHOT
      - OBJECT_TYPE_PATCH_ENVELOPE
      - OBJECT_TYPE_RESOURCE_USAGE_TRACK
      - OBJECT_TYPE_PATCH_ENVELOPE_REFERENCE
      - OBJECT_TYPE_DEV_PASSTHROUGH
      - OBJECT_TYPE_EDGE_NODE_CLUSTER
      - OBJECT_TYPE_ASSET_GROUP
      - OBJECT_TYPE_APP_PROFILE
      - OBJECT_TYPE_PROFILE_DEPLOYMENT
      - OBJECT_TYPE_ZKS_INSTANCE
      - OBJECT_TYPE_CLUSTER_GROUP
      default: OBJECT_TYPE_UNSPECIFIED
    ZcOpsType:
      type: string
      enum:
      - OPS_TYPE_UNSPECIFIED
      - OPS_TYPE_READ
      - OPS_TYPE_DELETE
      - OPS_TYPE_CREATE
      - OPS_TYPE_UPDATE
      - OPS_TYPE_LIST
      default: OPS_TYPE_UNSPECIFIED
      title: ZedCloud internal operation type
    GitRepoCondition:
      type: object
      properties:
        type:
          type: string
          description: Type of the condition
        status:
          type: string
          description: Status of the condition (True, False, Unknown)
        error:
          type: boolean
          description: Whether the condition represents an error state
        transitioning:
          type: boolean
          description: Whether the condition is in a transitioning state
        message:
          type: string
          description: Human readable message indicating details about the condition
        lastUpdateTime:
          type: string
          description: Last time the condition was updated
      description: Status condition information for a GitRepo
      title: GitRepo condition
    GitRepoData:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID where the GitRepo belongs (required)
        repoDetails:
          $ref: '#/components/schemas/GitRepoRepositoryDetails'
          description: Repository details and configuration (required)
        auth:
          $ref: '#/components/schemas/GitRepoAuthConfig'
          description: Authentication configuration
        target:
          $ref: '#/components/schemas/GitRepoTargetConfig'
          description: Target deployment configuration (required)
      description: Complete data specification for a GitRepo configuration
      title: GitRepo data
      required:
      - projectId
      - repoDetails
      - target
    GitRepoListResponse:
      type: object
      properties:
        totalCount:
          type: integer
          format: int32
          description: Total count of GitRepos
        stateSummary:
          $ref: '#/components/schemas/GitRepoListStatusSummary'
          description: Summary of GitRepo statuses
        gitrepos:
          type: array
          items:
            $ref: '#/components/schemas/GitRepoGetResponse'
          description: List of GitRepo entries
      description: Response for GitRepo LIST operations containing multiple GitRepo entries with summary information
      title: GitRepo list response
    GitRepoGetResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the GitRepo
        name:
          type: string
