definitions:
  appACEMatch:
    type: object
    properties:
      type:
        type: string
        description: Type
      value:
        type: string
        description: Value
    description: App ACE Match
    title: appACEMatch detail
    required:
    - type
    - value
  DevAccessPolicy:
    type: object
    properties:
      allowDev:
        type: boolean
        title: device side of edge-view access is allowed or not
  NtpServer:
    type: object
    properties:
      server:
        type: string
        description: NTP Server IP or FQDN
    description: NTP Server
    title: NTP Server
  EAPMethod:
    type: string
    enum:
    - EAP_METHOD_UNSPECIFIED
    - EAP_METHOD_TLS
    default: EAP_METHOD_UNSPECIFIED
    title: Supported EAP methods for port based network access control (802.1X)
  DebugKnobDetail:
    type: object
    properties:
      id:
        type: string
        description: system generated unique id for a device
        readOnly: true
        pattern: '[0-9A-Za-z-]+'
      debugKnob:
        type: boolean
        description: debug knob flag
      expiry:
        type: string
        format: uint64
        description: debug expiry time in minutes
      expired:
        type: boolean
        description: debug knob expiry status flag
    description: Device debug knob configuration request payload holds the device debug mode properties
    title: Device debug knob configuration
  Summary:
    type: object
    properties:
      description:
        type: string
        description: Summary description
      total:
        type: number
        format: int64
        description: Total
      values:
        type: object
        additionalProperties:
          type: integer
          format: int64
        description: 'Values: Map for storing <string, uint32>'
    description: Summary is used to store the Summary details
    title: Summary is used to store the Summary details
  GeoLocation:
    type: object
    properties:
      underlayIP:
        type: string
        description: Single IP address, either in IPv4 or in IPv6 format
      hostname:
        type: string
        description: Host name
      city:
        type: string
        description: City
      region:
        type: string
        description: Region
      country:
        type: string
        description: Country code consisting of 2 capital letters as per ISO 3166-1 alpha2 standard
      loc:
        type: string
        description: Ordered pair of (latitude, longitude) separated by comma (,). Latitude is the horizontal component used for geographic positioning; it is the angle between 0° (the equator) and ±90° (north or south) at the poles measured in decimal degrees. It is the first value in an ordered pair. A negative number denotes a location south of the equator; a positive number is north. Longitude is the vertical component used for geographic positioning; it is the angle between 0° (the Prime Meridian) and ±180° (westward or eastward) measured in decimal degrees. It is the second number in an ordered pair. A negative number indicates a location west of Greenwich, England; a positive number east.
      org:
        type: string
        description: The name of the recipient, firm, or company at this geographical location.
      postal:
        type: string
        description: Postal code (ZIP code for USA) of the geographical location
      latlong:
        type: string
        description: 'Deprecated field: comma, separated lat, long'
      freeloc:
        type: string
        description: Free formatted location string
    description: Geographic location of an edge node determined by a variety of data collection mechanisms (e.g. network routing addresses or internal GPS devices).
    title: Geographic location of an edge node
  vlanAdapter:
    type: object
    properties:
      logicalLabel:
        type: string
        description: Logical name of this VLAN adapter
      interfaceName:
        type: string
        description: A physical name of the VLAN sub-interface
      lowerLayerName:
        type: string
        description: Logical name of the lower layer adapter (bond or physicalIO)
      vlanId:
        type: integer
        format: int64
        description: Valid values are from 1 to 4094
      interface:
        $ref: '#/definitions/SysInterface'
        description: System Sub-Interface
    description: vlanAdapter represents a single VLAN sub-interface
    title: vlanAdapter payload detail
  DeviceGenerateImageType:
    type: string
    enum:
    - Installer
    - Live
    default: Installer
  Subject:
    type: object
    properties:
      commonName:
        type: string
        description: Certificate common name.
      country:
        type: array
        items:
          type: string
        description: List of countries.
      organization:
        type: array
        items:
          type: string
        description: List of organization.
      organizationalUnit:
        type: array
        items:
          type: string
        description: List of Organizational Unit.
      locality:
        type: array
        items:
          type: string
        description: List of locallity.
      postalCode:
        type: array
        items:
          type: string
        description: List of Postal codes.
      province:
        type: array
        items:
          type: string
        description: List of List of Prvince.
      serialNumber:
        type: string
        description: Subject cerial number
  Interface:
    type: object
    properties:
      name:
        type: string
        description: Interface name used by the edge application
      type:
        type: string
        description: Physical Adapter type for this interface. Applicable only when "direct attach" flag is true.
      optional:
        type: boolean
        description: Indicates if the interface is optional for edge application.
      directattach:
        type: boolean
        description: If true, a physical adapter is assigned to the edge application directly. If false, a network instance is assigned to the edge application.
      privateip:
        type: boolean
        description: If true, DHCP network can't be assigned and user needs to provide a static IP address.
      acls:
        type: array
        items:
          $ref: '#/definitions/Acl'
        description: Traffic access control rules for this interface. Applicable only when "direct attach" flag is false.
  Origin:
    type: string
    enum:
    - ORIGIN_UNSPECIFIED
    - ORIGIN_IMPORTED
    - ORIGIN_LOCAL
    - ORIGIN_GLOBAL
    - ORIGIN_APP_PROFILE_LOCAL
    default: ORIGIN_UNSPECIFIED
    description: "- ORIGIN_UNSPECIFIED: default options, which says no Operation/Invalid Operation\n - ORIGIN_IMPORTED: Object imported from global enterprise.\n - ORIGIN_LOCAL: Objectl created locally.\n - ORIGIN_GLOBAL: Object created in global store,\nto use this type user should have root previlage.\n - ORIGIN_APP_PROFILE_LOCAL: Object created via App profile"
    title: 'OriginType : enum specifies the Object orgigin type'
  NetworkDHCPType:
    type: string
    enum:
    - NETWORK_DHCP_TYPE_UNSPECIFIED
    - NETWORK_DHCP_TYPE_STATIC
    - NETWORK_DHCP_TYPE_PASSTHROUGH
    - NETWORK_DHCP_TYPE_DEPRECATED
    - NETWORK_DHCP_TYPE_CLIENT
    - NETWORK_DHCP_TYPE_STATIC_ADAPTER_SPECIFIC
    default: NETWORK_DHCP_TYPE_UNSPECIFIED
    title: "- NETWORK_DHCP_TYPE_STATIC: used for adapter configured DHCP static\n - NETWORK_DHCP_TYPE_PASSTHROUGH: used for adapter configured DHCP none, application will do DHCP\n - NETWORK_DHCP_TYPE_DEPRECATED: used for application simulation\n - NETWORK_DHCP_TYPE_CLIENT: used for adapter configured DHCP client\n - NETWORK_DHCP_TYPE_STATIC_ADAPTER_SPECIFIC: used to configure device adapter specific static networks"
  NetworkProxyProto:
    type: string
    enum:
    - NETWORK_PROXY_PROTO_HTTP
    - NETWORK_PROXY_PROTO_HTTPS
    - NETWORK_PROXY_PROTO_SOCKS
    - NETWORK_PROXY_PROTO_FTP
    - NETWORK_PROXY_PROTO_OTHER
    default: NETWORK_PROXY_PROTO_HTTP
  AdapterUsage:
    type: string
    enum:
    - ADAPTER_USAGE_UNSPECIFIED
    - ADAPTER_USAGE_MANAGEMENT
    - ADAPTER_USAGE_APP_DIRECT
    - ADAPTER_USAGE_APP_SHARED
    - ADAPTER_USAGE_DISABLED
    - ADAPTER_USAGE_VLANS_ONLY
    - ADAPTER_USAGE_BOND_MEMBER
    default: ADAPTER_USAGE_UNSPECIFIED
    description: "- ADAPTER_USAGE_UNSPECIFIED: Adapter unspecified\n - ADAPTER_USAGE_MANAGEMENT: Adapter can be used by EVE as well as other Edge applications\n - ADAPTER_USAGE_APP_DIRECT: Adapter is directly used by one edge application\n - ADAPTER_USAGE_APP_SHARED: Adapter can be shared by different network instances\n - ADAPTER_USAGE_DISABLED: Adapter disabled, for future use\n - ADAPTER_USAGE_VLANS_ONLY: Adapter is used exclusively for VLANs\n - ADAPTER_USAGE_BOND_MEMBER: Adapter is used exclusively for BOND interfaces"
    title: Adapter Usage
  NetworkInstanceDhcpType:
    type: string
    enum:
    - NETWORK_INSTANCE_DHCP_TYPE_UNSPECIFIED
    - NETWORK_INSTANCE_DHCP_TYPE_V4
    - NETWORK_INSTANCE_DHCP_TYPE_V6
    - NETWORK_INSTANCE_DHCP_TYPE_CRYPTOEID
    - NETWORK_INSTANCE_DHCP_TYPE_CRYPTOV4
    - NETWORK_INSTANCE_DHCP_TYPE_CRYPTOV6
    default: NETWORK_INSTANCE_DHCP_TYPE_UNSPECIFIED
    title: "NetworkInstanceDhcpType: Used in the network instance provide\n   dhcp server configuration"
  ModulePolicy:
    type: object
    properties:
      id:
        type: string
        description: unique id for deployment
        readOnly: true
        pattern: '[0-9-a-z-]+'
      labels:
        type: object
        additionalProperties:
          type: string
        description: Mapping of label variable keys and value
      priority:
        type: integer
        format: int64
        description: deployment priority of module manifest
        required:
        - priority
      targetCondition:
        type: string
        description: target condition for deployment that matches single device or group of devices
      metrics:
        $ref: '#/definitions/MetricsDetail'
        description: custom metrics for deployment
      Etag:
        type: string
        description: etag for deployment
      routes:
        type: object
        additionalProperties:
          type: string
        description: Mapping of routes variable keys and value
      apps:
        type: array
        items:
          $ref: '#/definitions/AppConfig'
        description: list of app details that will be provisioned on all the devices of the project to which this policy is attached
      targetConditionNew:
        type: object
        additionalProperties:
          type: string
        description: target condition for deployment that matches single device or group of devices
      azureEdgeAgent:
        $ref: '#/definitions/AppConfig'
        description: app that describes the azure edge agent to be deployed on the Azure runtime
      azureEdgeHub:
        $ref: '#/definitions/AppConfig'
        description: app that describes the azure edge hub to be deployed on the Azure runtime
    description: list of modules that will be provisioned on all the devices of the project to which this policy is attached
    title: Module policy body detail
    required:
    - apps
    - priority
  EdgeviewPolicy:
    type: object
    properties:
      edgeviewcfg:
        $ref: '#/definitions/EdgeviewCfg'
        description: Edgeview configuration and policies
      edgeviewAllow:
        type: boolean
        description: Allow device to enable Edgeview in this project
      accessAllowChange:
        type: boolean
        description: Allow inherit instance to change access policy
      maxExpireSec:
        type: integer
        format: int64
        description: Maximum seconds allowed for Edgeview session
      maxInst:
        type: integer
        format: int64
        description: Maximum instances allowed for Edgeview
      requireControllerAuthen:
        type: boolean
        description: Whether controller authentication is required for Edgeview access
    description: Policy for device edgeview operation
    title: Edgeview policy body detail
    required:
    - edgeviewAllow
  ObjectTagsList:
    type: object
    properties:
      objectTags:
        type: array
        items:
          $ref: '#/definitions/ObjectTag'
        description: Details of Object tags list records.
      next:
        $ref: '#/definitions/Cursor'
        description: Returned record page.
    description: Returned list of Object tags matched by filter criteria
    title: Object tag list records
  NetCellularAccessPoint:
    type: object
    properties:
      simSlot:
        type: integer
        format: int64
        description: 'SIM card slot to which this configuration applies.

          0 - unspecified (apply to currently activated or the only available)

          1 - config for SIM card in the first slot

          2 - config for SIM card in the second slot

          etc.'
      apn:
        type: string
        description: 'Access Point Network to connect into.

          By default it is "internet".'
      authProtocol:
        $ref: '#/definitions/evecommonCellularAuthProtocol'
        description: Authentication protocol used by the network.
      cipherData:
        $ref: '#/definitions/commonCipherBlock'
        description: 'Cipher data may contain encrypted user credentials

          (inside cellNetUsername and cellNetPassword fields).'
      preferredPlmns:
        type: array
        items:
          type: string
        description: 'The set of cellular network operators that modem should preferably try to register

          and connect into.

          Network operator should be referenced by PLMN (Public Land Mobile Network) code,

          consisting of 3-digits MCC (Mobile Country Code) and 2 or 3-digits MNC (Mobile Network Code),

          separated by a dash, e.g. "310-260".

          If empty, then modem will select the network automatically based on the SIM card config.'
      forbidRoaming:
        type: boolean
        description: If true, then modem will avoid connecting to networks with roaming.
      preferredRats:
        type: array
        items:
          $ref: '#/definitions/evecommonRadioAccessTechnology'
        description: 'The list of preferred Radio Access Technologies (RATs) to use for connecting

          to the network.

          Order matters, first is the most preferred, second is tried next, etc.

          Not listed technologies will not be tried.

          If empty, then modem will select RAT automatically.'
      ipType:
        $ref: '#/definitions/commonCellularIPType'
        description: The IP addressing type to use for the default bearer.
      attachApn:
        type: string
        description: 'Access Point Name (APN) for the attach (initial) bearer.

          This field is optional. If not specified, EVE will not send any attach bearer

          configuration to the modem. Instead, the modem will use one of its pre-installed

          profiles (see CellularProfile) to determine the configuration.'
      attachIpType:
        $ref: '#/definitions/commonCellularIPType'
        description: 'The IP addressing type to use for the attach bearer.

          Leave undefined if attach_apn is not specified.'
      attachAuthProtocol:
        $ref: '#/definitions/CellularAuthProtocol'
        description: 'Authentication protocol used for the attach bearer.

          Leave undefined if attach_apn is not specified.'
      secrets:
        $ref: '#/definitions/NetCellularAccessPointSecrets'
      encryptedSecrets:
        type: object
        additionalProperties:
          type: string
      cryptoKey:
        type: string
      attachSecrets:
        $ref: '#/definitions/NetCellularAccessPointSecrets'
      attachEncryptedSecrets:
        type: object
        additionalProperties:
          type: string
  ServicePoint:
    type: object
    properties:
      type:
        type: object
        $ref: '#/definitions/spType'
        description: Service Point Type
      NameOrIp:
        type: string
        description: Service name/ service name
      Credential:
        type: string
        description: Service credentials
    description: Service Point
    title: Service Point
  StaticDNSList:
    type: object
    properties:
      hostname:
        type: string
        description: Host name
      addrs:
        type: array
        items:
          type: string
        description: Addresses
    description: Static DNS list
    title: Static DNS list
  NetInstConfig:
    type: object
    properties:
      id:
        type: string
        description: System defined universally unique Id of the network instance
        readOnly: true
        pattern: '[0-9A-Za-z-]+'
        uniqueItems: true
      name:
        type: string
        description: User defined name of the network instance, unique across the enterprise. Once object is created, name can’t be changed
        maxLength: 256
        minLength: 3
        pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
        uniqueItems: true
      title:
        type: string
        description: User defined title of the network instance. Title can be changed at any time
        maxLength: 256
        minLength: 3
        pattern: ^[a-zA-Z0-9]+[a-zA-Z0-9!-~ ]+$
      description:
        type: string
        description: Detailed description of the network instance
        maxLength: 256
      revision:
        $ref: '#/definitions/ObjectRevision'
        description: system defined info for the object
      projectId:
        type: string
        description: id of the project in which network instance is created
      tags:
        type: object
        additionalProperties:
          type: string
        description: Tags are name/value pairs that enable you to categorize resources. Tag names are case insensitive with max_length 512 and min_length 3. Tag values are case sensitive with max_length 256 and min_length 3.
        maxLength: 32
        pattern: ^[^<%&?/\>]+$
      clusterID:
        type: string
        description: id of the Cluster in which the network instance is configured
        maxLength: 256
        minLength: 3
        pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
        uniqueItems: true
      deviceId:
        type: string
        description: id of the device on which network instance is created
        title: device on which this network is running
      port:
        type: string
        description: name of port mapping in the model
        title: name of port mapping in the model
      portTags:
        type: object
        additionalProperties:
          type: string
        description: Tags are name/value pairs that enable you to categorize resources. Tag names are case insensitive with max_length 512 and min_length 3. Tag values are case sensitive with max_length 256 and min_length 3.
        maxLength: 32
        pattern: ^[^<%&?/\>]+$
      kind:
        $ref: '#/definitions/NetworkInstanceKind'
        description: Kind of Network Instance ( Local, Switch etc )
      dhcp:
        type: boolean
        description: Deprecated
        title: dhcp - DEPRECATED
      type:
        $ref: '#/definitions/NetworkInstanceDhcpType'
        description: Type of DHCP for this Network Instance
      ip:
        $ref: '#/definitions/DhcpServerConfig'
        description: Dhcp Server Configuration
      dnsList:
        type: array
        items:
          $ref: '#/definitions/StaticDNSList'
        description: List of Static DNS entries
      oconfig:
        type: string
        title: Deprecated
      lisp:
        $ref: '#/definitions/LispConfig'
        description: 'Lisp Config : read only for now. Deprecated.'
      opaque:
        $ref: '#/definitions/NetInstOpaqueConfig'
        description: Service specific Config
      deviceDefault:
        type: boolean
        description: flag to indicate if this is the default network instance for the device
        title: flag to indicate if this is default network
      networkPolicyId:
        type: string
        description: id of the network policy to be attached to this network instance
      propagateConnectedRoutes:
        type: boolean
        description: Automatically propagate connected routes
      staticRoutes:
        type: array
        items:
          $ref: '#/definitions/StaticIPRoute'
        description: List of Static IP routes
      mtu:
        type: integer
        format: int64
        description: Maximum transmission unit (MTU) to set for the network instance and all application interfaces connected to it
      edgeNodeCluster:
        $ref: '#/definitions/NetInstEdgeNodeCluster'
        description: Edge Node Cluster
      forwardLldp:
        type: boolean
        description: 'Enables forwarding of LLDP (Link Layer Discovery Protocol) frames across this

          network instance.

          LLDP is used by devices to advertise identity and capabilities to directly

          connected neighbors, and is often required for topology discovery and network

          management tools.

          When enabled, LLDP frames (EtherType 0x88cc) are not dropped or suppressed

          by the forwarding plane.'
    description: Network instance provides Edge applications a variety of connectivity choices for all types of networks. This enables logical secure connectivity between Edge applications within a single Edge node and within a logical group of Edge nodes. This provides detailed configuration of a Network instance.
    title: Network instance detailed configuration
    required:
    - name
    - title
    - deviceId
    - port
    - kind
  ObjectRevision:
    type: object
    properties:
      prev:
        type: string
        description: Previous
      curr:
        type: string
        description: Current Database version of the record
      createdAt:
        type: object
        format: date-time
        description: The time, in milliseconds since the epoch, when the record was created.
      createdBy:
        type: string
        description: 'User data: Created By'
      updatedAt:
        type: object
        format: date-time
        description: The time, in milliseconds since the epoch, when the record was last updated.
      updatedBy:
        type: string
        description: 'User data: Updated By'
    description: ObjectRevision store the user details, who has doent the necessary operation like Create Operation or update operation
    title: ObjectRevision is used to store the user information.
    required:
    - curr
    - createdAt
    - createdBy
    - updatedAt
    - updatedBy
  NetCellularConfig:
    type: object
    properties:
      APN:
        type: string
        description: 'APN string - by default it is "internet".

          TO BE DEPRECATED: Fill connection arguments inside access_points instead.

          If access_points is non-empty, then APN field is ignored.'
      probe:
        $ref: '#/definitions/configCellularConnectivityProbe'
        description: 'Optional cellular connectivity probing.

          By default it is enabled.'
      locationTracking:
        type: boolean
        description: 'Some LTE modems have GNSS receiver integrated and can be used for device

          location tracking.

          Enable this option to have location info periodically obtained from this

          modem and published to controller and to applications.'
      accessPoints:
        type: array
        items:
          $ref: '#/definitions/NetCellularAccessPoint'
        description: 'Parameters to apply for connecting to cellular networks.

          Configured separately for every SIM card inserted into the modem.'
      activatedSimSlot:
        type: integer
        format: int64
        description: 'Select SIM card slot to activate.

          Currently, EVE support only single-standby SIM card mode.

          0 - unspecified (leave the currently activated)

          1 - activate the first SIM slot

          2 - activate the second SIM slot

          etc.'
  SANValues:
    type: object
    properties:
      hosts:
        type: array
        items:
          type: string
