    - PNAC_SUPPLICANT_STATE_DISCONNECTED
    - PNAC_SUPPLICANT_STATE_CONNECTING
    - PNAC_SUPPLICANT_STATE_AUTHENTICATING
    - PNAC_SUPPLICANT_STATE_AUTHENTICATED
    - PNAC_SUPPLICANT_STATE_FAILED
    - PNAC_SUPPLICANT_STATE_HELD
    default: PNAC_SUPPLICANT_STATE_UNSPECIFIED
    description: "PNACSupplicantState describes the 802.1X supplicant state for PNAC.\n\n - PNAC_SUPPLICANT_STATE_DISCONNECTED: Supplicant is idle or link is down; no authentication in progress.\n - PNAC_SUPPLICANT_STATE_CONNECTING: Link is up and the supplicant is initiating authentication.\n - PNAC_SUPPLICANT_STATE_AUTHENTICATING: Active EAP authentication exchange is in progress.\n - PNAC_SUPPLICANT_STATE_AUTHENTICATED: Authentication completed successfully; port is authorized.\n - PNAC_SUPPLICANT_STATE_FAILED: Authentication failed and access was not granted.\n - PNAC_SUPPLICANT_STATE_HELD: Supplicant is in a held or backoff state following repeated failures."
