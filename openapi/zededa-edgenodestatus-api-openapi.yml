    description: "NetworkConfigOrigin enumerates all possible origins of a network port configuration.\n\n - NETWORK_CONFIG_ORIGIN_UNSPECIFIED: Unknown or unset origin.\n - NETWORK_CONFIG_ORIGIN_CONTROLLER: Config received from the controller.\n - NETWORK_CONFIG_ORIGIN_BOOTSTRAP: Initial device config embedded in the EVE installer, signed by the controller.\n - NETWORK_CONFIG_ORIGIN_OVERRIDE: Manually created JSON config injected into the installer.\n - NETWORK_CONFIG_ORIGIN_LASTRESORT: Fallback configuration automatically generated to enable DHCP on all Ethernet ports.\nUsed when no network config is available or when \"network.fallback.any.eth\" is enabled\nand none of the existing configs provide controller connectivity.\n - NETWORK_CONFIG_ORIGIN_TUI: Config entered via the terminal UI (TUI).\n - NETWORK_CONFIG_ORIGIN_LOC: Configuration signed by the controller and delivered through the\nLocal Operator Console (LOC) in an air-gapped environment.\n - NETWORK_CONFIG_ORIGIN_LPS: Config changes made locally through the Local Profile Server (LPS)."
