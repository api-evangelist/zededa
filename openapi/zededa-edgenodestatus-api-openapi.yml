    description: "Certificate lifecycle and availability status as reported by the device.\n\n - ENROLLED_CERT_STATUS_AVAILABLE: Certificate is present, valid, and usable for authentication.\n - ENROLLED_CERT_STATUS_PENDING: Certificate enrollment is in progress and not yet complete.\n - ENROLLED_CERT_STATUS_RENEWAL_PENDING: Certificate is present and still valid, but a renewal request\nis in progress and not yet completed.\n - ENROLLED_CERT_STATUS_EXPIRED: Certificate has expired (the current time is past notAfter).\nRenewal may have failed; see err for related errors.\n - ENROLLED_CERT_STATUS_REVOKED: Certificate has been revoked or is otherwise considered invalid.\n - ENROLLED_CERT_STATUS_ENROLLMENT_FAILED: Certificate enrollment failed and no valid certificate is available.\n - ENROLLED_CERT_STATUS_RENEWAL_FAILED: A certificate is currently present but the most recent renewal attempt failed.\n - ENROLLED_CERT_STATUS_INVALID_CONFIG: Certificate configuration is invalid or malformed, preventing enrollment or renewal."
