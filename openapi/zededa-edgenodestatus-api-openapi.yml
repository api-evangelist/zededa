  /v1/devices/status:
    get:
      summary: Query status of edge nodes
      description: Query the status of edge nodes as reported by the edge nodes themselves
      operationId: EdgeNodeStatus_QueryEdgeNodeStatus
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/DeviceStatusListMsg'
        '400':
          description: Bad Request. The API gateway did not process the request because of invalid value of filter parameters.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '401':
          description: Unauthorized. The API gateway did not process the request because it lacks valid authentication credentials for the target resource. The request header has either no authorization details or an authorization that has been refused.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '403':
          description: Forbidden. The API gateway did not process the request because the requestor does not have edge-node level access permission for the operation or does not have access scope to the project.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '500':
          description: Internal Server Error. The API gateway experienced an unexpected condition. Specific error condition is indicated in error codes.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '504':
          description: Gateway Timeout. The API gateway did not receive a timely response from an upstream microservice it needed to communicate with in order to complete the request.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/googlerpcStatus'
      parameters:
      - name: summary
        in: query
        required: false
        type: boolean
      - name: runState
        in: query
        required: false
        type: string
        enum:
        - UNSPECIFIED
        - ONLINE
        - HALTED
        - INIT
        - REBOOTING
        - OFFLINE
        - UNKNOWN
        - UNPROVISIONED
        - PROVISIONED
        - SUSPECT
        - DOWNLOADING
        - RESTARTING
        - PURGING
        - HALTING
        - ERROR
        - VERIFYING
        - LOADING
        - CREATING_VOLUME
        - BOOTING
        - MAINTENANCE_MODE
        - START_DELAYED
        - BASEOS_UPDATING
        - PREPARING_POWEROFF
        - POWERING_OFF
        - PREPARED_POWEROFF
        default: UNSPECIFIED
      - name: projectName
        in: query
        required: false
        type: string
      - name: load
        in: query
        required: false
        type: string
        enum:
        - UNSPECIFIED
        - FREE
        - MODERATE
        - HEAVY
        default: UNSPECIFIED
      - name: namePattern
        in: query
        required: false
        type: string
      - name: tags
        in: query
        required: false
        type: string
      - name: projectNamePattern
        in: query
        required: false
        type: string
      - name: deviceName
        in: query
        required: false
        type: string
      - name: next.pageToken
        description: Page Token
        in: query
        required: false
        type: string
      - name: next.orderBy
        description: OrderBy helps in sorting the list response
        in: query
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
      - name: next.pageNum
        description: Page Number
        in: query
        required: false
        type: number
        format: int64
      - name: next.pageSize
        description: Defines the page size
        in: query
        required: false
        type: number
        format: int64
      - name: next.totalPages
        description: Total number of pages to be fetched.
        in: query
        required: false
        type: number
        format: int64
      - name: fields
        description: 'Fields to select for composite api: id, name, title, serialNo, projectId, projectName, isEveLatest, appInstCount, runState, adminState.'
        in: query
        required: false
        type: array
        items:
          type: string
        collectionFormat: multi
      - name: adminState
        description: " - CREATED: Entity Created in the controller\n - DELETED: Entity Deleted in the controller\n - ACTIVE: Entity Activated in the controller\n - INACTIVE: Entity Deactivated in the controller\n - REGISTERED: Specific to Edge-node - Edge-node Registered with the controller\n - ARCHIVED: Entity Archived in the controller"
        in: query
        required: false
        type: string
        enum:
        - UNSPECIFIED
        - CREATED
        - DELETED
        - ACTIVE
        - INACTIVE
        - REGISTERED
        - ARCHIVED
        default: UNSPECIFIED
      - name: eveLtsSupportType
        description: filter devices by eve version support type i.e LTS OR NON_LTS
        in: query
        required: false
        type: string
        enum:
        - SUPPORT_TYPE_UNSPECIFIED
        - SUPPORT_TYPE_LTS
        - SUPPORT_TYPE_NON_LTS
        default: SUPPORT_TYPE_UNSPECIFIED
      - name: includeInterfaces
        description: flag to indicate whether to include network interface details in the response
        in: query
        required: false
        type: boolean
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        type: string
      tags:
      - EdgeNodeStatus
      externalDocs:
        description: ZEDEDA Product Documentation
        url: https://docs.zededa.com/-M-8m8d8KqdLpfOgY_jo/edge-nodes
