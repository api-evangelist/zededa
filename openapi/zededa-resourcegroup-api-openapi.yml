definitions:
  appACEMatch:
    type: object
    properties:
      type:
        type: string
        description: Type
      value:
        type: string
        description: Value
    description: App ACE Match
    title: appACEMatch detail
    required:
    - type
    - value
  NetworkInstPolicy:
    type: object
    properties:
      metaData:
        $ref: '#/definitions/PolicyCommon'
        description: all the required metadata for a policy like id, name, different types of tags
      netInstConfig:
        $ref: '#/definitions/NetworkInstConfig'
        description: network instance config details
  DevAccessPolicy:
    type: object
    properties:
      allowDev:
        type: boolean
        title: device side of edge-view access is allowed or not
  NtpServer:
    type: object
    properties:
      server:
        type: string
        description: NTP Server IP or FQDN
    description: NTP Server
    title: NTP Server
  EAPMethod:
    type: string
    enum:
    - EAP_METHOD_UNSPECIFIED
    - EAP_METHOD_TLS
    default: EAP_METHOD_UNSPECIFIED
    title: Supported EAP methods for port based network access control (802.1X)
  DevicePolicy:
    type: object
    properties:
      metaData:
        $ref: '#/definitions/PolicyCommon'
        description: all the required metadata for a policy like id, name, different types of tags
      policySubType:
        $ref: '#/definitions/DevicePolicyType'
        description: device policy type
      attestationPolicy:
        $ref: '#/definitions/DeviceAttestationPolicy'
        description: device attestation policy
      pcrPolicy:
        $ref: '#/definitions/DevicePCRPolicy'
        description: PCR policy for TPM volume key sealing
      portBasedNetworkAccessControlPolicy:
        $ref: '#/definitions/DevicePortBasedNetworkAccessControlPolicy'
        description: port based network access control (802.1X) policy for devices
  Summary:
    type: object
    properties:
      description:
        type: string
        description: Summary description
      total:
        type: number
        format: int64
        description: Total
      values:
        type: object
        additionalProperties:
          type: integer
          format: int64
        description: 'Values: Map for storing <string, uint32>'
    description: Summary is used to store the Summary details
    title: Summary is used to store the Summary details
  EventQueryResponseItem:
    type: object
    properties:
      user:
        type: string
        description: User name
      project:
        type: string
        description: project name
      device:
        type: string
        description: device name
      instance:
        type: string
        description: instance name
      severity:
        type: string
        description: 'severity: FIXME: should be ENUM'
      description:
        type: string
        description: Event description
      timestamp:
        type: object
        format: date-time
        description: event timestamp
      source:
        type: object
        $ref: '#/definitions/EventSource'
        description: source
      resource:
        type: string
        description: Event resources
      eventType:
        type: string
        description: Event type
      tags:
        type: array
        items:
          type: string
        description: Event tags
      resourceName:
        type: string
        description: Event resources
      jsonData:
        type: object
        description: Event resources
      clusterInstance:
        type: string
        description: clusterInstance name
    description: Event query response item payload
    title: Event query response item payload detail
  Subject:
    type: object
    properties:
      commonName:
        type: string
        description: Certificate common name.
      country:
        type: array
        items:
          type: string
        description: List of countries.
      organization:
        type: array
        items:
          type: string
        description: List of organization.
      organizationalUnit:
        type: array
        items:
          type: string
        description: List of Organizational Unit.
      locality:
        type: array
        items:
          type: string
        description: List of locallity.
      postalCode:
        type: array
        items:
          type: string
        description: List of Postal codes.
      province:
        type: array
        items:
          type: string
        description: List of List of Prvince.
      serialNumber:
        type: string
        description: Subject cerial number
  Interface:
    type: object
    properties:
      name:
        type: string
        description: Interface name used by the edge application
      type:
        type: string
        description: Physical Adapter type for this interface. Applicable only when "direct attach" flag is true.
      optional:
        type: boolean
        description: Indicates if the interface is optional for edge application.
      directattach:
        type: boolean
        description: If true, a physical adapter is assigned to the edge application directly. If false, a network instance is assigned to the edge application.
      privateip:
        type: boolean
        description: If true, DHCP network can't be assigned and user needs to provide a static IP address.
      acls:
        type: array
        items:
          $ref: '#/definitions/Acl'
        description: Traffic access control rules for this interface. Applicable only when "direct attach" flag is false.
  Origin:
    type: string
    enum:
    - ORIGIN_UNSPECIFIED
    - ORIGIN_IMPORTED
    - ORIGIN_LOCAL
    - ORIGIN_GLOBAL
    - ORIGIN_APP_PROFILE_LOCAL
    default: ORIGIN_UNSPECIFIED
    description: "- ORIGIN_UNSPECIFIED: default options, which says no Operation/Invalid Operation\n - ORIGIN_IMPORTED: Object imported from global enterprise.\n - ORIGIN_LOCAL: Objectl created locally.\n - ORIGIN_GLOBAL: Object created in global store,\nto use this type user should have root previlage.\n - ORIGIN_APP_PROFILE_LOCAL: Object created via App profile"
    title: 'OriginType : enum specifies the Object orgigin type'
  InterfaceOrdering:
    type: string
    enum:
    - INTERFACE_ORDERING_DISABLED
    - INTERFACE_ORDERING_ENABLED
    default: INTERFACE_ORDERING_DISABLED
    description: "- INTERFACE_ORDERING_DISABLED: Default value. interface order will not be sent to eve\n - INTERFACE_ORDERING_ENABLED: interface ordering is enabled. interface order will be sent to eve according to app template"
    title: 'this enum is used for enable and disable the interface ordering for app instances

      if the value of it set to INTERFACE_ORDERING_ENABLED then the interface ordering is

      sent to eve and therfaces will be mapped in same order during the deployment of app instances'
  NetworkInstanceDhcpType:
    type: string
    enum:
    - NETWORK_INSTANCE_DHCP_TYPE_UNSPECIFIED
    - NETWORK_INSTANCE_DHCP_TYPE_V4
    - NETWORK_INSTANCE_DHCP_TYPE_V6
    - NETWORK_INSTANCE_DHCP_TYPE_CRYPTOEID
    - NETWORK_INSTANCE_DHCP_TYPE_CRYPTOV4
    - NETWORK_INSTANCE_DHCP_TYPE_CRYPTOV6
    default: NETWORK_INSTANCE_DHCP_TYPE_UNSPECIFIED
    title: "NetworkInstanceDhcpType: Used in the network instance provide\n   dhcp server configuration"
  ModulePolicy:
    type: object
    properties:
      id:
        type: string
        description: unique id for deployment
        readOnly: true
        pattern: '[0-9-a-z-]+'
      labels:
        type: object
        additionalProperties:
          type: string
        description: Mapping of label variable keys and value
      priority:
        type: integer
        format: int64
        description: deployment priority of module manifest
        required:
        - priority
      targetCondition:
        type: string
        description: target condition for deployment that matches single device or group of devices
      metrics:
        $ref: '#/definitions/MetricsDetail'
        description: custom metrics for deployment
      Etag:
        type: string
        description: etag for deployment
      routes:
        type: object
        additionalProperties:
          type: string
        description: Mapping of routes variable keys and value
      apps:
        type: array
        items:
          $ref: '#/definitions/AppConfig'
        description: list of app details that will be provisioned on all the devices of the project to which this policy is attached
      targetConditionNew:
        type: object
        additionalProperties:
          type: string
        description: target condition for deployment that matches single device or group of devices
      azureEdgeAgent:
        $ref: '#/definitions/AppConfig'
        description: app that describes the azure edge agent to be deployed on the Azure runtime
      azureEdgeHub:
        $ref: '#/definitions/AppConfig'
        description: app that describes the azure edge hub to be deployed on the Azure runtime
    description: list of modules that will be provisioned on all the devices of the project to which this policy is attached
    title: Module policy body detail
    required:
    - apps
    - priority
  EdgeviewPolicy:
    type: object
    properties:
      edgeviewcfg:
        $ref: '#/definitions/EdgeviewCfg'
        description: Edgeview configuration and policies
      edgeviewAllow:
        type: boolean
