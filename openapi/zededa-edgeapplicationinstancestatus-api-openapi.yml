components:
  schemas:
    IoType:
      type: string
      enum:
      - IO_TYPE_UNSPECIFIED
      - IO_TYPE_ETH
      - IO_TYPE_USB
      - IO_TYPE_COM
      - IO_TYPE_AUDIO
      - IO_TYPE_WLAN
      - IO_TYPE_WWAN
      - IO_TYPE_HDMI
      - IO_TYPE_LTE
      - IO_TYPE_STORAGE_NVME_DEVICE
      - IO_TYPE_STORAGE_SATA_DEVICE
      - IO_TYPE_ETH_PF
      - IO_TYPE_ETH_VF
      - IO_TYPE_USB_CONTROLLER
      - IO_TYPE_USB_DEVICE
      - IO_TYPE_CAN
      - IO_TYPE_VCAN
      - IO_TYPE_LCAN
      - IO_TYPE_OTHER
      default: IO_TYPE_UNSPECIFIED
      description: "- IO_TYPE_UNSPECIFIED: No operation/ Invalid peration\n - IO_TYPE_ETH: Ethernet\n - IO_TYPE_USB: USB Type - General\n - IO_TYPE_COM: Communication Port\n - IO_TYPE_AUDIO: Audio Port\n - IO_TYPE_WLAN: wireless LAN\n - IO_TYPE_WWAN: Wireless wide area network\n - IO_TYPE_HDMI: High-Definition Multimedia Interface\n - IO_TYPE_LTE: LTE Interfaces\n - IO_TYPE_STORAGE_NVME_DEVICE: Storage NVME device\n - IO_TYPE_STORAGE_SATA_DEVICE: Storage SATA device\n - IO_TYPE_ETH_PF: Physical Interface (PF) of the Virtual Functions\n - IO_TYPE_ETH_VF: Virtual Function (VF)\n - IO_TYPE_USB_CONTROLLER: USB Type - Controller\n - IO_TYPE_USB_DEVICE: USB Type - Device\n - IO_TYPE_CAN: CAN - Device\n - IO_TYPE_VCAN: VCAN - Virtual CAN device\n - IO_TYPE_LCAN: LCAN - Logical CAN device\n - IO_TYPE_OTHER: Other Io Types"
      title: Input/Output Type
    Summary:
      type: object
      properties:
        description:
          type: string
          description: Summary description
        total:
          type: number
          format: int64
          description: Total
        values:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: 'Values: Map for storing <string, uint32>'
      description: Summary is used to store the Summary details
      title: Summary is used to store the Summary details
    AppInstanceLogs:
      type: object
      properties:
        access:
          type: boolean
          description: Flags to enable / disable sending of logs generated by app instance to zedcloud
      description: App Instance Logs configuration
      title: App Instance Logs configuration
      required:
      - access
    AppInstStatusSummaryMsg:
      type: object
      properties:
        id:
          type: string
          description: System defined universally unique Id of the app instance
          readOnly: true
          pattern: '[0-9A-Za-z-]+'
          uniqueItems: true
        name:
          type: string
          description: User defined name of the app instance, unique across the enterprise. Once app instance is created, name can’t be changed
          maxLength: 256
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
          uniqueItems: true
        deviceId:
          type: string
          description: User defined name of the device, unique across the enterprise. Once device is created, name can’t be changed
          maxLength: 256
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
          uniqueItems: true
        appId:
          type: string
          description: User defined name of the edge app, unique across the enterprise. Once edge app is created, name can’t be changed
          maxLength: 256
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
          uniqueItems: true
        tags:
          type: object
          additionalProperties:
            type: string
          description: Tags are name/value pairs that enable you to categorize resources. Tag names are case insensitive with max_length 512 and min_length 3. Tag values are case sensitive with max_length 256 and min_length 3.
          maxLength: 32
          pattern: ^[^<%&?/\>]+$
        adminState:
          $ref: '#/components/schemas/AdminState'
          description: SPU details
        clusterID:
          type: string
          description: System defined universally unique clusterInstance ID, unique across the enterprise.
          maxLength: 256
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
          uniqueItems: true
        runState:
          $ref: '#/components/schemas/RunState'
          description: operation status
        Memory:
          $ref: '#/components/schemas/MemorySummary'
          description: memory summary
        Storage:
          $ref: '#/components/schemas/StorageSummary'
          description: storage summary
        swState:
          $ref: '#/components/schemas/SWState'
          description: sotware state
        Cpu:
          $ref: '#/components/schemas/CpuSummary'
          description: cpu summary
        projectId:
          type: string
          description: User defined name of the project, unique across the enterprise. Once project is created, name can’t be changed
          maxLength: 256
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
          uniqueItems: true
        title:
          type: string
          description: User defined title of the app instance. Title can be changed at any time
          maxLength: 256
          minLength: 3
          pattern: ^[a-zA-Z0-9]+[a-zA-Z0-9!-~ ]+$
        appType:
          $ref: '#/components/schemas/AppType'
          description: type of app
        deploymentType:
          $ref: '#/components/schemas/DeploymentType'
          description: 'type of deployment for the app, eg: azure, k3s, standalone'
        memorySummary:
          $ref: '#/components/schemas/AppInstMemorySummary'
          description: memory summary
        swInfo:
          type: array
          items:
            $ref: '#/components/schemas/SWInfo'
          description: Software details
        appName:
          type: string
          description: User defined name of the edge app, unique across the enterprise. Once edge app is created, name can’t be changed
          maxLength: 256
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
          uniqueItems: true
        projectName:
          type: string
          description: User defined name of the project, unique across the enterprise. Once project is created, name can’t be changed
          maxLength: 256
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
          uniqueItems: true
        deviceName:
          type: string
          description: User defined name of the device, unique across the enterprise. Once device is created, name can’t be changed
          maxLength: 256
          minLength: 3
          pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
          uniqueItems: true
        netStatusList:
          type: array
          items:
            $ref: '#/components/schemas/NetworkStatus'
          description: network status list
      description: AppInstStatusSummaryMsg stores the summary of the app instance status
      title: App instance status summary
