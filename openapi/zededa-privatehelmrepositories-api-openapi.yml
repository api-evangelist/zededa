openapi: 3.2.0
info:
  title: ZEDEDA Kubernetes Service Private Helm Repositories API
  description: The ZEDEDA Kubernetes Service provides APIs for managing Kubernetes deployments and Helm charts in edge clusters.
  termsOfService: https://www.zededa.com/terms
  version: '1.0'
  contact:
    name: ZEDEDA API Support
    url: https://www.zededa.com/support
    email: support@zededa.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: /api
security:
- ApiKeyAuth: []
tags:
- name: PrivateHelmRepositories
  description: APIs for managing private Helm repositories and their authentication configurations
paths:
  /v1/cluster/instances/kubernetes/helm/repository:
    get:
      summary: List all private Helm repositories
      description: 'Retrieve a list of all configured private Helm repositories with their status and configuration information.


        **Example Request:**

        ```

        GET /v1/cluster/instances/kubernetes/helm/repository

        ```


        **Example Response:**

        ```json

        {

        "list": [

        {

        "id": "private-repo-abc123",

        "metadata": {

        "name": "company-charts",

        "title": "Company Private Helm Repository",

        "description": "Private Helm repository containing company-specific charts",

        "tags": {

        "environment": "production"

        }

        },

        "spec": {

        "repoDetails": {

        "type": "PRIVATE_REPO_TYPE_HELM_INDEX",

        "url": "https://charts.company.com/helm"

        }

        },

        "status": {

        "error": false,

        "message": "Repository is accessible",

        "name": "company-charts"

        },

        "repoIdentifier": "company-charts-repo"

        },

        {

        "id": "private-repo-def456",

        "metadata": {

        "name": "team-charts",

        "title": "Team Specific Charts",

        "description": "Charts for team-specific applications"

        },

        "spec": {

        "repoDetails": {

        "type": "PRIVATE_REPO_TYPE_GIT",

        "url": "https://git.company.com/helm-charts",

        "branch": "main"

        }

        },

        "status": {

        "error": false,

        "message": "Repository is accessible",

        "name": "team-charts"

        },

        "repoIdentifier": "team-charts-repo"

        }

        ],

        "total": 2

        }

        ```'
      operationId: PrivateHelmRepositories_ListPrivateRepos
      responses:
        '200':
          description: Successfully retrieved private repository list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateRepoListResponse'
        '400':
          description: Bad Request. The API gateway did not process the request because of invalid value of filter parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to list private repositories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to retrieve private repository list due to server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - PrivateHelmRepositories
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        schema:
          type: string
    post:
      summary: Create a new private Helm repository
      description: 'Create a new private Helm repository configuration to access Helm charts from private repositories with authentication. This enables deployment of Helm charts from secured repositories.


        **Example Request:**

        ```json

        {

        "metadata": {

        "name": "company-charts",

        "title": "Company Private Helm Repository",

        "description": "Private Helm repository containing company-specific charts",

        "tags": {

        "environment": "production",

        "team": "platform"

        }

        },

        "spec": {

        "repoDetails": {

        "type": "PRIVATE_REPO_TYPE_HELM_INDEX",

        "url": "https://charts.company.com/helm",

        "branch": "main"

        },

        "auth": {

        "secret": {

        "type": "SECRET_TYPE_BASIC_AUTH",

        "name": "helm-repo-credentials"

        }

        }

        }

        }

        ```


        **Example Response:**

        ```json

        {

        "operationType": "OPS_TYPE_UNSPECIFIED",

        "operationStatus": "OPS_STATUS_UNSPECIFIED",

        "objectKind": "",

        "objectId": "private-repo-abc123",

        "objectName": "company-charts",

        "objectRevision": "",

        "objectType": "OBJECT_TYPE_UNSPECIFIED",

        "operationTime": "",

        "startTime": "",

        "endTime": "",

        "user": "",

        "httpStatusCode": 201,

        "httpStatusMsg": "",

        "jobId": "",

        "error": [

        {

        "ec": "zMsgSucess",

        "location": "",

        "details": ""

        }

        ]

        }

        ```'
      operationId: PrivateHelmRepositories_CreatePrivateRepo
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '201':
          description: Successfully created private Helm repository configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '400':
          description: Bad Request. Invalid repository configuration or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to create private repository configurations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '409':
          description: Conflict. Private repository configuration with the same name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to create private repository configuration due to server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        schema:
          type: string
      tags:
      - PrivateHelmRepositories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateRepoCreateRequest'
        required: true
  /v1/cluster/instances/kubernetes/helm/repository/id/{id}:
    put:
      summary: Update private Helm repository
      description: 'Update an existing private Helm repository configuration. This allows modification of repository details, authentication settings, and metadata. The repository name cannot be changed after creation.


        **Example Request:**

        ```json

        {

        "id": "private-repo-abc123",

        "metadata": {

        "name": "company-charts",

        "title": "Updated Company Private Helm Repository",

        "description": "Updated private Helm repository containing company-specific charts",

        "tags": {

        "environment": "production",

        "team": "platform",

        "updated": "2024-01-15"

        }

        },

        "spec": {

        "repoDetails": {

        "type": "PRIVATE_REPO_TYPE_HELM_INDEX",

        "url": "https://charts.company.com/helm/v2",

        "branch": "main"

        },

        "auth": {

        "secret": {

        "type": "SECRET_TYPE_TOKEN",

        "name": "updated-helm-repo-token"

        }

        }

        }

        }

        ```


        **Example Response:**

        ```json

        {

        "operationType": "OPS_TYPE_UNSPECIFIED",

        "operationStatus": "OPS_STATUS_UNSPECIFIED",

        "objectKind": "",

        "objectId": "private-repo-abc123",

        "objectName": "company-charts",

        "objectRevision": "",

        "objectType": "OBJECT_TYPE_UNSPECIFIED",

        "operationTime": "",

        "startTime": "",

        "endTime": "",

        "user": "",

        "httpStatusCode": 200,

        "httpStatusMsg": "",

        "jobId": "",

        "error": [

        {

        "ec": "zMsgSucess",

        "location": "",

        "details": ""

        }

        ]

        }

        ```'
      operationId: PrivateHelmRepositories_UpdatePrivateRepo
      responses:
        '200':
          description: Successfully updated private repository configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '400':
          description: Bad Request. Invalid repository configuration or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to update this private repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '404':
          description: Not Found. Private repository with the specified ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '409':
          description: Conflict. Cannot update private repository due to conflicting state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to update private repository due to server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: id
        description: Unique identifier of the private repository to update (required)
        in: path
        required: true
        schema:
          type: string
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        schema:
          type: string
      tags:
      - PrivateHelmRepositories
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  $ref: '#/components/schemas/PrivateRepoMetadata'
                  description: Metadata for the private repository (name cannot be updated, required)
                spec:
                  $ref: '#/components/schemas/PrivateRepoSpec'
                  description: Specification for the private repository (required)
              description: Request message for updating an existing private repository configuration
              title: Private Repository update request
              required:
              - metadata
              - spec
        required: true
  /v1/cluster/instances/kubernetes/helm/repository/id/{privateRepoId}:
    get:
      summary: Get private Helm repository by ID
      description: 'Retrieve detailed information about a specific private Helm repository including its configuration, authentication details, and status.


        **Example Request:**

        ```

        GET /v1/cluster/instances/kubernetes/helm/repository/id/private-repo-abc123

        ```


        **Example Response:**

        ```json

        {

        "id": "private-repo-abc123",

        "metadata": {

        "name": "company-charts",

        "title": "Company Private Helm Repository",

        "description": "Private Helm repository containing company-specific charts",

        "tags": {

        "environment": "production",

        "team": "platform"

        }

        },

        "spec": {

        "repoDetails": {

        "type": "PRIVATE_REPO_TYPE_HELM_INDEX",

        "url": "https://charts.company.com/helm",

        "branch": "main"

        },

        "auth": {

        "secret": {

        "id": "secret-123",

        "type": "SECRET_TYPE_BASIC_AUTH",

        "name": "helm-repo-credentials",

        "data": {

        "username": "helm-user",

        "password": "***"

        }

        }

        }

        },

        "status": {

        "error": false,

        "message": "Repository is accessible and ready",

        "name": "company-charts",

        "transitioning": false

        },

        "repoIdentifier": "company-charts-repo"

        }

        ```'
      operationId: PrivateHelmRepositories_GetPrivateRepo
      responses:
        '200':
          description: Successfully retrieved private repository configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateRepoGetByIdResponse'
        '400':
          description: Bad Request. Invalid repository ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to view this private repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '404':
          description: Not Found. Private repository with the specified ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to retrieve private repository due to server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: privateRepoId
        description: 'Unique identifier of the Private Repository (required). Example: ''private-repo-abc123'''
        in: path
        required: true
        schema:
          type: string
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        schema:
          type: string
      tags:
      - PrivateHelmRepositories
    delete:
      summary: Delete private Helm repository
      description: 'Delete a private Helm repository configuration. This will remove access to the private repository and all its associated configurations. This action is irreversible.


        **Example Request:**

        ```

        DELETE /v1/cluster/instances/kubernetes/helm/repository/id/private-repo-abc123

        ```


        **Example Response:**

        ```json

        {

        "operationType": "OPS_TYPE_UNSPECIFIED",

        "operationStatus": "OPS_STATUS_UNSPECIFIED",

        "objectKind": "",

        "objectId": "private-repo-abc123",

        "objectName": "company-charts",

        "objectRevision": "",

        "objectType": "OBJECT_TYPE_UNSPECIFIED",

        "operationTime": "",

        "startTime": "",

        "endTime": "",

        "user": "",

        "httpStatusCode": 200,

        "httpStatusMsg": "",

        "jobId": "",

        "error": [

        {

        "ec": "zMsgSucess",

        "location": "",

        "details": ""

        }

        ]

        }

        ```


        **Warning:** This operation will remove the private repository configuration and stop access to its charts. Any deployments using charts from this repository may be affected.


        **Note:** The private_repo_id parameter is **required** and must be a valid repository identifier.'
      operationId: PrivateHelmRepositories_DeletePrivateRepo
      responses:
        '200':
          description: Successfully deleted private repository configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '400':
          description: Bad Request. Invalid repository ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to delete this private repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '404':
          description: Not Found. Private repository with the specified ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '409':
          description: Conflict. Cannot delete private repository because it is currently in use by deployments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to delete private repository due to server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: privateRepoId
        description: 'Unique identifier of the Private Repository (required). Example: ''private-repo-abc123'''
        in: path
        required: true
        schema:
          type: string
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        schema:
          type: string
      tags:
      - PrivateHelmRepositories
  /v1/cluster/instances/kubernetes/helm/repository/id/{privateRepoId}/charts:
    get:
      summary: Get Helm charts from private repository
      description: 'Retrieve a list of available Helm charts from a specific private repository with their versions and metadata.


        **Example Request:**

        ```

        GET /v1/cluster/instances/kubernetes/helm/repository/id/private-repo-abc123/charts

        ```


        **Example Response:**

        ```json

        {

        "api_version": "v2",

        "generated": "2024-01-15T12:00:00Z",

        "repo_identifier": "company-charts-repo",

        "repo_name": "Company Private Repository",

        "entries": {

        "company-app": [

        {

        "name": "company-app",

        "version": "2.1.0",

        "app_version": "1.5.0",

        "description": "Company proprietary application",

        "created": "2024-01-10T09:00:00Z",

        "digest": "sha256:abc123def456...",

        "urls": ["/charts/company-app-2.1.0.tgz"]

        },

        {

        "name": "company-app",

        "version": "2.0.0",

        "app_version": "1.4.0",

        "description": "Company proprietary application",

        "created": "2024-01-05T14:30:00Z",

        "digest": "sha256:def456ghi789...",

        "urls": ["/charts/company-app-2.0.0.tgz"]

        }

        ],

        "internal-service": [

        {

        "name": "internal-service",

        "version": "1.0.0",

        "app_version": "0.9.0",

        "description": "Internal microservice",

        "created": "2024-01-12T16:45:00Z",

        "digest": "sha256:ghi789jkl012...",

        "urls": ["/charts/internal-service-1.0.0.tgz"]

        }

        ]

        }

        }

        ```'
      operationId: PrivateHelmRepositories_GetPrivateRepoCharts
      responses:
        '200':
          description: Successfully retrieved chart list from private repository
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelmChartListResponse'
        '400':
          description: Bad Request. Invalid repository ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to access this private repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '404':
          description: Not Found. Private repository with the specified ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to retrieve charts from private repository due to server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZsrvResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: privateRepoId
        description: 'Unique identifier of the Private Repository (required). Example: ''private-repo-abc123'''
        in: path
        required: true
        schema:
          type: string
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
        schema:
          type: string
      tags:
      - PrivateHelmRepositories
components:
  schemas:
    ZsrvResponse:
      type: object
      properties:
        operationType:
          $ref: '#/components/schemas/ZcOpsType'
          title: "Describes one of the operations type : possible values\n                        Read/Delete/Create/Update/List"
        operationStatus:
          $ref: '#/components/schemas/ZcOpsStatus'
          title: if this is log running job
        objectKind:
          type: string
          title: zedcloud object kind on which the operation was performed
        objectId:
          type: string
          title: Unique value identifies the object that was operated on
        objectName:
          type: string
          title: name of the object
        objectRevision:
          type: string
          title: 'object revision post the operation, note Read operation

            doesn''t change the revision'
        objectType:
          $ref: '#/components/schemas/ObjectType'
        operationTime:
          type: string
          title: time of operation
        startTime:
          type: string
          title: total time taken by operations
        endTime:
          type: string
        user:
          type: string
          title: the operation is performed on behalf of this user
        httpStatusCode:
          type: integer
          format: int32
          title: http response
        httpStatusMsg:
          type: string
          title: summary of the error in text format
        jobId:
          type: string
          title: for tracking asynchronous tasks
        error:
          type: array
          items:
            $ref: '#/components/schemas/ZsrvError'
          title: 'one or more errors will be set if the operation failed

            i.e. httpStatusCode != 2xx'
    ZsrvErrorCode:
      type: string
      enum:
      - zMsgErrorNone
      - zMsgSucess
      - NotFound
      - AlreadyExists
      - VersionMismatch
      - RangeError
      - LargeResult
      - IncompleteData
      - InvalidData
      - FunctionUnsupported
      - NoMemory
      - SendFailure
      - Timeout
      - BadReqBody
      - BadReqParam
      - InvalidFieldFormat
      - UrlNotFound
      - ApiVersionNotSupported
      - Unauthorized
      - Forbidden
      - Conflict
      - NotModified
      - DependencyConflict
      - JsonFmtError
      - ProtoFmtError
      - CertError
      - DataBaseConnection
      - DBError
      - zMsgAccepted
      - zMsgCreated
      - PreConditionFailed
      - InternalServerError
      default: zMsgErrorNone
      description: "- zMsgErrorNone: common validation errors\n - IncompleteData: message had fields that weren't filled in\n - InvalidData: message contained the field that wasn't expected\n - FunctionUnsupported: this feature unavailable on this version of device\n - InvalidFieldFormat: message contained the field that wasn't correctly formatted\n - JsonFmtError: Marshal / Unmarshal errors\n - DataBaseConnection: generic DB error"
      title: ZedCould internal error code
    PrivateRepoAuthConfig:
      type: object
      properties:
        secret:
          $ref: '#/components/schemas/PrivateRepoSecretConfig'
          description: Secret configuration for authentication
      description: Authentication configuration for private repository access
      title: Private Repository authentication configuration
    ObjectType:
      type: string
      enum:
      - OBJECT_TYPE_UNSPECIFIED
      - OBJECT_TYPE_USER
      - OBJECT_TYPE_EDGE_NODE
      - OBJECT_TYPE_EDGE_APP
      - OBJECT_TYPE_IMAGE
      - OBJECT_TYPE_EDGE_APP_INSTANCE
      - OBJECT_TYPE_PROJECT
      - OBJECT_TYPE_NETWORK
      - OBJECT_TYPE_DATASTORE
      - OBJECT_TYPE_SERVICE
      - OBJECT_TYPE_SERVICE_INSTANCE
      - OBJECT_TYPE_ENTERPRISE
      - OBJECT_TYPE_ROLE
      - OBJECT_TYPE_CREDENTIAL
      - OBJECT_TYPE_NETWORK_INSTANCE
      - OBJECT_TYPE_VOLUME_INSTANCE
      - OBJECT_TYPE_REALM
      - OBJECT_TYPE_AUTHPROFILE
      - OBJECT_TYPE_POLICY
      - OBJECT_TYPE_APP_POLICY
      - OBJECT_TYPE_CLUSTER_INSTANCE
      - OBJECT_TYPE_PLUGIN
      - OBJECT_TYPE_DOC_POLICY
      - OBJECT_TYPE_ORCHESTRATOR_CLUSTER
      - OBJECT_TYPE_TAGS
      - OBJECT_TYPE_EDGE_NODE_INTERFACE
      - OBJECT_TYPE_DEPLOYMENT
      - OBJECT_TYPE_ENTITLEMENTS
      - OBJECT_TYPE_DATA_STREAM
      - OBJECT_TYPE_API_USAGE
      - OBJECT_TYPE_APP_INSTANCE_SNAPSHOT
      - OBJECT_TYPE_PATCH_ENVELOPE
      - OBJECT_TYPE_RESOURCE_USAGE_TRACK
      - OBJECT_TYPE_PATCH_ENVELOPE_REFERENCE
      - OBJECT_TYPE_DEV_PASSTHROUGH
      - OBJECT_TYPE_EDGE_NODE_CLUSTER
      - OBJECT_TYPE_ASSET_GROUP
      - OBJECT_TYPE_APP_PROFILE
      - OBJECT_TYPE_PROFILE_DEPLOYMENT
      - OBJECT_TYPE_ZKS_INSTANCE
      - OBJECT_TYPE_CLUSTER_GROUP
      default: OBJECT_TYPE_UNSPECIFIED
    ZcOpsType:
      type: string
      enum:
