components:
  schemas:
    DocPolicies:
      type: object
      properties:
        summaryByState:
          $ref: '#/components/schemas/Summary'
          description: Summary of filtered docpolicy
        list:
          type: array
          items:
            $ref: '#/components/schemas/DocPolicySummary'
          description: List of docpolicy
        next:
          $ref: '#/components/schemas/Cursor'
          description: Page details of the filtered records
    AuthType:
      type: string
      enum:
      - AUTH_TYPE_UNSPECIFIED
      - AUTH_TYPE_LOCAL
      - AUTH_TYPE_OAUTH
      - AUTH_TYPE_SAML
      default: AUTH_TYPE_UNSPECIFIED
    Summary:
      type: object
      properties:
        description:
          type: string
          description: Summary description
        total:
          type: number
          format: int64
          description: Total
        values:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: 'Values: Map for storing <string, uint32>'
      description: Summary is used to store the Summary details
      title: Summary is used to store the Summary details
    LastLoggedinUserInfo:
      type: object
      properties:
        name:
          type: string
        lastLoginTime:
          type: string
          format: date-time
    CrudContent:
      type: object
      properties:
        oid:
          $ref: '#/components/schemas/Identifier64'
        encoding:
          $ref: '#/components/schemas/CrudContentEncoding'
        clazz:
          $ref: '#/components/schemas/ModelClazz'
        protobuf:
          $ref: '#/components/schemas/CrudContentProtobuf'
        json:
          $ref: '#/components/schemas/CrudContentJSON'
      title: Content, with a type encoded either as protobuf or json
    PasswordProfile:
      type: object
      properties:
        minLength:
          type: integer
          format: int64
        maxLength:
          type: integer
          format: int64
        minNumericChars:
          type: integer
          format: int64
        minSymbolChars:
          type: integer
          format: int64
        minUppercaseChars:
          type: integer
          format: int64
        minLowercaseChars:
          type: integer
          format: int64
        maxPasswordAge:
          type: integer
          format: int64
        minPasswordAge:
          type: integer
          format: int64
        numPrevPasswordCheck:
          type: integer
          format: int64
        passwordExpiryNotificationPeriodInSeconds:
