    - SW_STATE_VERIFIED
    - SW_STATE_INSTALLED
    - SW_STATE_BOOTING
    - SW_STATE_RUNNING
    - SW_STATE_HALTING
    - SW_STATE_HALTED
    - SW_STATE_REFRESHING
    - SW_STATE_PURGING
    - SW_STATE_RESOLVING_TAG
    - SW_STATE_RESOLVED_TAG
    - SW_STATE_CREATING_VOLUME
    - SW_STATE_CREATED_VOLUME
    - SW_STATE_VERIFYING
    - SW_STATE_LOADING
    - SW_STATE_LOADED
    - SW_STATE_AWAITNETWORKINSTANCE
