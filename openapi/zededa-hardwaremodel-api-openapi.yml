            originType:
              $ref: '#/definitions/Origin'
              description: origin of object
            PCRTemplates:
              type: array
              items:
                $ref: '#/definitions/PCRTemplate'
              description: PCR templates keyed by EVE version
            isImported:
              type: boolean
