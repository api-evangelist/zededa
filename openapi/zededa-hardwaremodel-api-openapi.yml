        in: query
        required: false
        type: string
        enum:
        - UNSPECIFIED
        - ONLINE
        - HALTED
        - INIT
        - REBOOTING
        - OFFLINE
        - UNKNOWN
        - UNPROVISIONED
        - PROVISIONED
        - SUSPECT
        - DOWNLOADING
        - RESTARTING
        - PURGING
        - HALTING
        - ERROR
        - VERIFYING
        - LOADING
        - CREATING_VOLUME
        - BOOTING
        - MAINTENANCE_MODE
        - START_DELAYED
        - BASEOS_UPDATING
        - PREPARING_POWEROFF
        - POWERING_OFF
        - PREPARED_POWEROFF
        default: UNSPECIFIED
      - name: projectName
        in: query
        required: false
        type: string
      - name: load
        in: query
        required: false
        type: string
        enum:
        - UNSPECIFIED
        - FREE
        - MODERATE
        - HEAVY
        default: UNSPECIFIED
      - name: namePattern
        in: query
        required: false
        type: string
      - name: tags
        in: query
        required: false
        type: string
      - name: projectNamePattern
        in: query
        required: false
        type: string
      - name: deviceName
        in: query
        required: false
        type: string
      - name: next.pageToken
