          items:
            $ref: '#/components/schemas/DocPolicySummary'
          description: List of docpolicy
        next:
          $ref: '#/components/schemas/Cursor'
          description: Page details of the filtered records
    AuthType:
      type: string
      enum:
      - AUTH_TYPE_UNSPECIFIED
      - AUTH_TYPE_LOCAL
      - AUTH_TYPE_OAUTH
      - AUTH_TYPE_SAML
      default: AUTH_TYPE_UNSPECIFIED
    Summary:
      type: object
      properties:
        description:
          type: string
          description: Summary description
        total:
          type: number
          format: int64
          description: Total
        values:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: 'Values: Map for storing <string, uint32>'
      description: Summary is used to store the Summary details
      title: Summary is used to store the Summary details
    CrudContent:
      type: object
      properties:
        oid:
          $ref: '#/components/schemas/Identifier64'
        encoding:
          $ref: '#/components/schemas/CrudContentEncoding'
        clazz:
          $ref: '#/components/schemas/ModelClazz'
        protobuf:
          $ref: '#/components/schemas/CrudContentProtobuf'
        json:
          $ref: '#/components/schemas/CrudContentJSON'
      title: Content, with a type encoded either as protobuf or json
    AAA_Frontend_LoginWithPasswordRequest:
      type: object
      properties:
        usernameAtRealm:
          type: string
        username:
          type: string
        realm:
          type: string
        password:
          type: string
        verbosePolicy:
          type: boolean
          title: How verbal should the response be
        verboseSimpleUser:
          type: boolean
        verboseDetailedUser:
          type: boolean
        verboseRealm:
          type: boolean
        verboseEnterprise:
          type: boolean
        enterpriseName:
          type: string
      description: User either a combination of (username, realm) or (usernameAtRealm) to specify login details
      title: Login request
    LastLoggedinUserInfo:
      type: object
      properties:
        name:
          type: string
        lastLoginTime:
          type: string
          format: date-time
    AAARequestEnterpriseSignup:
      type: object
      properties:
        enterprise:
          $ref: '#/components/schemas/Enterprise'
        adminUser:
          $ref: '#/components/schemas/AdminUserSignup'
        realmList:
          type: array
          items:
            type: string
        profileType:
          $ref: '#/components/schemas/AuthProfileType'
        token:
          type: string
        title:
          type: string
        employerName:
          type: string
    PasswordProfile:
      type: object
      properties:
        minLength:
          type: integer
          format: int64
        maxLength:
          type: integer
          format: int64
        minNumericChars:
          type: integer
          format: int64
        minSymbolChars:
          type: integer
          format: int64
        minUppercaseChars:
          type: integer
          format: int64
        minLowercaseChars:
          type: integer
          format: int64
        maxPasswordAge:
          type: integer
          format: int64
        minPasswordAge:
          type: integer
          format: int64
        numPrevPasswordCheck:
          type: integer
          format: int64
        passwordExpiryNotificationPeriodInSeconds:
          type: integer
          format: int64
