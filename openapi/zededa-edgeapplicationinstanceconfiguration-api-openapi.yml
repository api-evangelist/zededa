      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            name:
              type: string
              description: User defined name of the app instance, unique across the enterprise. Once app instance is created, name can’t be changed
              maxLength: 256
              minLength: 3
              pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
              uniqueItems: true
            title:
              type: string
              description: User defined title of the app instance. Title can be changed at any time
              maxLength: 256
              minLength: 3
              pattern: ^[a-zA-Z0-9]+[a-zA-Z0-9!-~ ]+$
            description:
              type: string
              description: Detailed description of the app instance
              maxLength: 256
            revision:
              $ref: '#/definitions/ObjectRevision'
              description: app instance object revision details
            projectId:
              type: string
              description: project name which the given app instance belong to
            tags:
              type: object
              additionalProperties:
                type: string
              description: Tags are name/value pairs that enable you to categorize resources. Tag names are case insensitive with max_length 512 and min_length 3. Tag values are case sensitive with max_length 256 and min_length 3.
              maxLength: 32
              pattern: ^[^<%&?/\>]+$
            clusterID:
              type: string
              description: System defined universally unique clusterInstance ID, unique across the enterprise.
              maxLength: 256
              minLength: 3
              pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
              uniqueItems: true
            appId:
              type: string
              description: User defined name of the edge app, unique across the enterprise. Once app name is created, name can’t be changed
              maxLength: 256
              minLength: 3
              pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
              uniqueItems: true
            deviceId:
              type: string
              description: User defined name of the device name, unique across the enterprise. Once device name is defined, name can’t be changed
              maxLength: 256
              minLength: 3
              pattern: '[a-zA-Z0-9][a-zA-Z0-9_.-]+'
              uniqueItems: true
            activate:
              type: boolean
              description: app instance activation flag
            vminfo:
              $ref: '#/definitions/vm'
              description: virtual machine info
            drives:
              type: array
              items:
                $ref: '#/definitions/drive'
              description: drive details
            interfaces:
              type: array
              items:
                $ref: '#/definitions/appInterface'
              description: application interfaces
            userData:
              type: string
              description: 'Deprecated: Application initiazation script in cloud-config format to be used by cloud-init'
            customConfig:
              $ref: '#/definitions/CustomConfig'
              description: Application initialization script template in cloud-config format and user specified values
            collectStatsIPAddr:
              type: string
              description: holds the static Ip of the app instance
            bundleversion:
              type: string
              description: version of bundle app is referring to
            logs:
              $ref: '#/definitions/AppInstanceLogs'
              description: App Instance logs
            restart:
              $ref: '#/definitions/ZedCloudOpsCmd'
              description: 'Restart counter: ZedCloudOpsCmd'
            refresh:
              $ref: '#/definitions/ZedCloudOpsCmd'
              description: 'Refresh counter: ZedCloudOpsCmd'
            purge:
              $ref: '#/definitions/ZedCloudOpsCmd'
              description: 'Purge counter: ZedCloudOpsCmd'
            remoteConsole:
              type: boolean
              description: Remote console flag
            encryptedSecrets:
              type: object
              additionalProperties:
                type: string
              description: user encrypted secrets map
            cryptoKey:
              type: string
              description: Crypto Key for decrypting user secret information
            manifestInfo:
              $ref: '#/definitions/ManifestInfo'
              description: app manifest Info
            appType:
              $ref: '#/definitions/AppType'
              description: type of bundle
            isSecretUpdated:
              type: boolean
              description: This field tells whether user secrets has updated or not, especially the cusotom config
            appPolicyId:
              type: string
              description: app policy id
            deploymentType:
              $ref: '#/definitions/DeploymentType'
              description: 'type of deployment for the app, eg: azure, k3s, standalone'
            userDefinedVersion:
              type: string
              description: Instance version tells which edge app does this instance is running
            startDelayInSeconds:
              type: integer
              format: int64
              description: start delay is the time in seconds EVE should wait after boot before starting the application instance
            cloudInitVersion:
              type: integer
              format: int64
              description: Cloud-init version that indicates whether it necessary or not for cloud-init tool to restart in a guest
            allowSnapshots:
              type: boolean
              description: Flag to determine if a snapshot creation is allowed
            maxSnapshots:
              type: integer
              format: int64
              description: Maximum number of snapshots allowed to be created
            availableSnapshots:
              type: array
              items:
                $ref: '#/definitions/AppInstanceSnapshot'
              description: The list of available snapshots of the application instance
            patchEnvelopeId:
              type: string
              description: patch envelope id
            patchEnvelopeName:
              type: string
              description: patch envelope name
            edgeNodeCluster:
              $ref: '#/definitions/AppInstEdgeNodeCluster'
              description: edge node cluster
            dockerComposeYamlText:
              type: string
              description: Docker compose base64 encoded plain text
              title: internal field
              readOnly: true
            dockerComposeTarImageName:
              type: string
              description: Docker compose tar image name
              title: internal field
              readOnly: true
            datastoreIdList:
