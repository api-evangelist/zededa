      tags:
      - ZKSClusterInstances
  /v1/zks/instances/status:
    get:
      summary: Get ZKS instances status
      description: "Retrieve detailed status information for all ZKS instances including runtime metrics, capacity information, and node health.\n\n**Query Parameters:**\n- `zksid` (optional): Filter by ZKS instance ID\n- `zksname` (optional): Filter by ZKS instance name\n- `zksnamePattern` (optional): Filter by ZKS instance name pattern\n- `projectName` (optional): Filter by project name\n- `projectNamePattern` (optional): Filter by project name pattern\n- `tags` (optional): Filter by tags (JSON object)\n\n**Example Request:**\n```\nGET /v1/zks/instances/status\nGET /v1/zks/instances/status?zksname=production-cluster\nGET /v1/zks/instances/status?projectName=production-project\n```\n\n**Example Response:**\n```json\n{\n  \"list\": [\n    {\n      \"id\": \"zks-instance-abc123\",\n      \"projectId\": \"project-123\",\n      \"name\": \"production-cluster\",\n      \"title\": \"Production Kubernetes Cluster\",\n      \"description\": \"Main production cluster\",\n      \"tags\": {\n        \"environment\": \"production\"\n      },\n      \"runState\": \"DEPLOYED\",\n      \"kubeVersion\": \"v1.28.2\",\n      \"architecture\": \"amd64\",\n      \"created\": \"2024-01-15T10:00:00Z\",\n      \"totalResources\": 100,\n      \"nOfNodes\": 3,\n      \"deployments\": 15,\n      \"capacity\": {\n        \"pods\": {\n          \"used\": 25,\n          \"total\": 110\n        },\n        \"cpus\": {\n          \"reserved\": {\n            \"current\": 2.5,\n            \"total\": 8.0\n          },\n          \"used\": {\n            \"current\": 1.8,\n            \"total\": 8.0\n          }\n        },\n        \"memory\": {\n          \"reserved\": {\n            \"current\": 4.0,\n            \"total\": 16.0\n          },\n          \"used\": {\n            \"current\": 3.2,\n            \"total\": 16.0\n          }\n        }\n      },\n      \"projectName\": \"Production Project\",\n      \"isImported\": false\n    }\n  ],\n  \"summaries\": {\n    \"statuses\": {\n      \"online\": 3,\n      \"init\": 0,\n      \"suspect\": 0,\n      \"error\": 0,\n      \"unspecified\": 0,\n      \"unknown\": 0,\n      \"offline\": 0,\n      \"pending\": 0\n    }\n  },\n  \"next\": {\n    \"pageToken\": \"next-page-token\"\n  }\n}\n```"
      operationId: ZKSClusterInstances_GetZKSInstancesStatus
      responses:
        '200':
          description: Successfully retrieved ZKS instances status
          schema:
            $ref: '#/definitions/ZksInstanceStatusListResp'
        '400':
          description: Bad Request. Invalid query parameters.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to view ZKS instances status.
          schema:
