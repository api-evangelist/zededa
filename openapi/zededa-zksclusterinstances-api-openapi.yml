  /v1/zks/instances/k3s-versions:
    get:
      summary: Get available K3s versions
      description: "Retrieve a list of available K3s versions that can be used for cluster creation or upgrades.\n\n**Example Request:**\n```\nGET /v1/zks/instances/k3s-versions\n```\n\n**Example Response:**\n```json\n{\n  \"list\": [\n    {\n      \"id\": \"v1.28.5+k3s1\",\n      \"version\": \"v1.28.5+k3s1\",\n      \"type\": \"release\"\n    },\n    {\n      \"id\": \"v1.28.4+k3s2\",\n      \"version\": \"v1.28.4+k3s2\",\n      \"type\": \"release\"\n    },\n    {\n      \"id\": \"v1.27.9+k3s1\",\n      \"version\": \"v1.27.9+k3s1\",\n      \"type\": \"release\"\n    },\n    {\n      \"id\": \"v1.29.0+k3s1\",\n      \"version\": \"v1.29.0+k3s1\",\n      \"type\": \"beta\"\n    }\n  ]\n}\n```"
