            $ref: '#/definitions/ZsrvResponse'
        '400':
          description: Bad Request. Invalid upgrade configuration or empty instance IDs list.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to upgrade ZKS instances.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '404':
          description: Not Found. One or more ZKS instances with the specified IDs do not exist.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '409':
          description: Conflict. Cannot upgrade due to cluster state or ongoing operations.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to initiate K3s upgrade due to server error.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/googlerpcStatus'
      parameters:
      - name: body
        in: body
        required: true
        schema:
