          description: Successfully retrieved registration commands
          schema:
            $ref: '#/definitions/ZksInstanceRegistrationInfo'
        '400':
          description: Bad Request. Invalid ZKS instance name format.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to view registration commands.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '404':
          description: Not Found. ZKS instance with the specified name does not exist.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '500':
          description: Internal Server Error. Failed to retrieve registration commands due to server error.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/googlerpcStatus'
      parameters:
      - name: zksName
        description: Name of the ZKS instance. This field is required and must be a valid ZKS instance name.
        in: path
        required: true
        type: string
      - name: X-Request-Id
        in: header
        required: false
        description: User-Agent specified id to track a request
