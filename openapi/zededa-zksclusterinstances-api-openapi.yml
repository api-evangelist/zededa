  /v1/zks/instances/name/{zksName}/metrics:
    get:
      summary: Get ZKS instance metrics by name
      description: "Retrieve detailed metrics for a specific ZKS instance by its name including resource utilization and capacity information.\n\n**Example Request:**\n```\nGET /v1/zks/instances/name/production-cluster/metrics\n```\n\n**Example Response:**\n```json\n{\n  \"id\": \"zks-instance-abc123\",\n  \"name\": \"production-cluster\",\n  \"provider\": \"k3s\",\n  \"kubeVersion\": \"v1.28.2+k3s1\",\n  \"architecture\": \"amd64\",\n  \"created\": \"2024-01-15T10:00:00Z\",\n  \"totalResources\": 100,\n  \"nOfNodes\": 3,\n  \"deployments\": 15,\n  \"capacity\": {\n    \"pods\": {\n      \"used\": 25,\n      \"total\": 110\n    },\n    \"cpus\": {\n      \"reserved\": {\n        \"current\": 2.5,\n        \"total\": 8.0\n      },\n      \"used\": {\n        \"current\": 1.8,\n        \"total\": 8.0\n      }\n    },\n    \"memory\": {\n      \"reserved\": {\n        \"current\": 4.0,\n        \"total\": 16.0\n      },\n      \"used\": {\n        \"current\": 3.2,\n        \"total\": 16.0\n      }\n    }\n  }\n}\n```"
      operationId: ZKSClusterInstances_GetZKSInstanceMetricsByName
      responses:
        '200':
          description: Successfully retrieved ZKS instance metrics
          schema:
            $ref: '#/definitions/ZksInstanceMetrics'
        '400':
          description: Bad Request. Invalid ZKS instance name format.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '401':
          description: Unauthorized. Authentication credentials are missing or invalid.
          schema:
            $ref: '#/definitions/ZsrvResponse'
        '403':
          description: Forbidden. User does not have permission to view metrics for this ZKS instance.
