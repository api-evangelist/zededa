    - OPS_TYPE_DELETE
    - OPS_TYPE_CREATE
    - OPS_TYPE_UPDATE
    - OPS_TYPE_LIST
    default: OPS_TYPE_UNSPECIFIED
    title: ZedCloud internal operation type
  Severity:
    type: string
    enum:
    - SEVERITY_UNSPECIFIED
    - SEVERITY_NOTICE
    - SEVERITY_WARNING
    - SEVERITY_ERROR
    default: SEVERITY_UNSPECIFIED
    title: Severity tells the severity type
  ObjectType:
