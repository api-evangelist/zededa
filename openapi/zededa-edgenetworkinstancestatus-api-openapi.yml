    default: NETWORK_INSTANCE_DHCP_TYPE_UNSPECIFIED
    title: "NetworkInstanceDhcpType: Used in the network instance provide\n   dhcp server configuration"
  Entity:
    type: string
    enum:
    - ENTITY_UNSPECIFIED
    - ENTITY_BASE_OS
    - ENTITY_SYSTEM_ADAPTER
    - ENTITY_VAULT
    - ENTITY_ATTESTATION
    - ENTITY_APP_INSTANCE
    - ENTITY_PORT
    - ENTITY_NETWORK
    - ENTITY_NETWORK_INSTANCE
    - ENTITY_CONTENT_TREE
    - ENTITY_CONTENT_BLOB
