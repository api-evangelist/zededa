    - DATASTORE_TYPE_AWSS3
    - DATASTORE_TYPE_SFTP
    - DATASTORE_TYPE_CONTAINERREGISTRY
    - DATASTORE_TYPE_AZUREBLOB
    - DATASTORE_TYPE_ZEDEDAS3
    - DATASTORE_TYPE_ZEDEDABLOB
    - DATASTORE_TYPE_FILE_STORAGE
