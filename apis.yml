aid: zededa
name: Zededa
description: 'ZEDEDA is an edge intelligence platform that helps enterprises deploy, manage, and secure
  AI workloads and applications across thousands of distributed edge sites. Its ZedCloud control plane
  orchestrates EVE-OS edge nodes, edge applications, virtual networks, storage, and managed Kubernetes
  (ZKS) through a REST API served under https://zedcontrol.zededa.net/api. The API is grpc-gateway generated
  and published as ten Swagger 2.0 service specifications (App Profiles, Edge Applications, Diagnostics,
  Jobs, Kubernetes, Networks, Node Clusters, Edge Nodes, Storage, and IAM) totaling 421 operations, with
  an official Terraform provider for infrastructure-as-code. ZEDEDA was surfaced as a portfolio company
  of lux-capital and enriched by the API Evangelist pipeline.'
